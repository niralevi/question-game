function tone(f,d,type,v,when,to){const a=ac();if(!a||muted)return;const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();

function makeShim(){
  return {join:(name,create)=>new Promise((resolve,reject)=>{
    const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
    let myId=null,list=[],ph=[],topics={};
    const room={
      emit:(t,d)=>{ws.send(JSON.stringify({t:'emit',topic:t,data:d}));return Promise.resolve()},
      on:(t,f)=>{(topics[t]=topics[t]||[]).push(f)},
      presence:p=>{ws.send(JSON.stringify({t:'presence',name:p.name}));return Promise.resolve()},
      peers:()=>list.map(x=>({kind:'viewer',peer:x.peer,presence:{name:x.name},isMe:x.peer===myId,sameTab:x.peer===myId})),
      onPeers:f=>{ph.push(f)},
      leave:()=>{ws.onclose=null;ws.close()}
    };
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.t==='hello'){myId=m.peer;resolve(room)}
      else if(m.t==='denied'){ws.onclose=null;ws.close();reject(new Error(m.why))}
      else if(m.t==='peers'){list=m.list;ph.forEach(f=>f())}
      else if(m.t==='msg'){(topics[m.topic]||[]).forEach(f=>f({topic:m.topic,data:m.data,peer:m.peer,isMe:m.peer===myId,sameTab:m.peer===myId,kind:'viewer'}))}
    };
    ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:name,create:!!create}));
    ws.onerror=()=>reject(new Error('ws'));
    ws.onclose=()=>{alert('החיבור לשרת נותק. רעננו את הדף.')};
  })};
}

function bind(){
  const g=id=>document.getElementById(id);
  if(g('mk'))g('mk').onclick=()=>{const n=g('nm').value.trim();if(!n){err='כתבו שם';return render()}myName=n;isHost=true;enter(String(1000+Math.floor(Math.random()*9000)),true)};
  if(g('jn'))g('jn').onclick=()=>{const n=g('nm').value.trim(),c=g('cd').value.trim();myName=n;codeDraft=c;if(!n||c.length!==4){err='כתבו שם וקוד בן 4 ספרות';return render()}isHost=false;enter(c,false)};
  if(g('st'))g('st').onclick=()=>startRound(true);
  [['s_r','rounds'],['s_a','ansT'],['s_d','disT'],['s_v','votT'],['s_t','revT'],['s_i','imps'],['s_n','noImp'],['s_c','acc'],['s_g','agent']].forEach(([id,k])=>{const e=g(id);if(e)e.onchange=()=>{
    if(e.value==='custom'){customK=k;customV='';return render()}
    customK=null;cfg[k]=+e.value;room.emit('settings',cfg);render()}});
  const applyCustom=()=>{const n=Math.round(+customV);if(customV!==''&&isFinite(n)){const[lo,hi]=LIM[customK];cfg[customK]=Math.min(hi,Math.max(lo,n));room.emit('settings',cfg)}customK=null;render()};
  if(g('cok'))g('cok').onclick=applyCustom;
  if(g('cv')){g('cv').oninput=e=>{customV=e.target.value};g('cv').onkeydown=e=>{if(e.key==='Enter')applyCustom()};g('cv').focus()}
  document.querySelectorAll('[data-kk]').forEach(b=>b.onclick=()=>{const id=b.dataset.kk;if(confirm('להוציא את '+pname(id)+' מהלובי?'))room.emit('kick',{t:id})});
  document.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const id=b.dataset.mk;if(confirm('להעביר את הניהול ל-'+pname(id)+'?'))room.emit('host',{h:id})});
  if(g('mg'))g('mg').onclick=()=>{showMng=!showMng;render(true)};
  if(g('sa'))g('sa').onclick=sendAns;
  if(g('an')){g('an').oninput=e=>{draft=e.target.value};g('an').focus();g('an').onkeydown=e=>{if(e.key==='Enter')sendAns()}}
  if(g('sh'))g('sh').onclick=()=>room.emit('phase',{rid:S.rid,ph:'discuss'});
  if(g('gv'))g('gv').onclick=()=>room.emit('phase',{rid:S.rid,ph:'vote'});
  if(g('rv'))g('rv').onclick=()=>room.emit('phase',{rid:S.rid,ph:'reveal'});
  if(g('nx'))g('nx').onclick=()=>startRound(false);
  if(g('nw'))g('nw').onclick=()=>room.emit('tolobby',{});
  if(g('lv'))g('lv').onclick=()=>{if(isHost)room.emit('close',{});else leaveLobby('')};
  if(g('tl'))g('tl').onclick=()=>room.emit('tolobby',{});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>room.emit('vote',{rid:S.rid,t:b.dataset.v}));

function setPhase(ph){
  if(!S||ORD[ph]===undefined||ORD[ph]<=ORD[S.phase])return;
  S.phase=ph;lastTick=-1;
  S.endAt=ph==='discuss'?Date.now()+G.cfg.disT*1000:ph==='vote'?Date.now()+G.cfg.votT*1000:ph==='reveal'&&G.cur<G.total?Date.now()+G.cfg.revT*1000:0;
  if(ph==='reveal'){doScore();sfx(myWin()?'win':'lose')}else sfx('phase');
  render();
}
function myWin(){
  if(myPeer===S.agent)return S.agentOk;
  if(S.imps.includes(myPeer))return S.top!==myPeer;
  if(myPeer===S.acc)return !S.caught;
  return S.caught;
}
function doScore(){
  if(S.scored)return;S.scored=true;
  const imps=S.imps,isImp=id=>imps.includes(id),tally={};
  Object.values(S.votes).forEach(t=>tally[t]=(tally[t]||0)+1);
  const max=Math.max(0,...Object.values(tally)),top=Object.keys(tally).filter(k=>tally[k]===max);
  const topOne=max>0&&top.length===1?top[0]:null; // תיקו = אף אחד לא הודח
  const caught=imps.length?isImp(topOne):topOne==='none';
  const agentOk=!!(S.agent&&S.target&&topOne===S.target),gain={};
  const good=v=>imps.length?isImp(v):v==='none';
  S.players.forEach(p=>{const id=p.p;let g=0;
    if(isImp(id))g=S.players.filter(q=>!isImp(q.p)&&S.votes[q.p]!==id).length*100+(topOne===id?0:200);
    else if(id===S.acc)g=caught?0:300;
    else if(id===S.agent)g=agentOk?400:0;
    else{if(good(S.votes[id]))g+=200;if(caught)g+=100}
    gain[id]=g});
  G.stats=G.stats||{};const st=id=>G.stats[id]=G.stats[id]||{good:0,esc:0,sus:0,mis:0};
  S.players.forEach(p=>{const id=p.p;if(!isImp(id)&&id!==S.acc&&id!==S.agent&&good(S.votes[id]))st(id).good++;st(id).sus+=tally[id]||0;if(isImp(id)&&topOne!==id)st(id).esc++});
  if(agentOk)st(S.agent).mis++;
  S.players.forEach(p=>G.scores[p.p]=(G.scores[p.p]||0)+gain[p.p]);
  S.tally=tally;S.caught=caught;S.gain=gain;S.top=topOne;S.agentOk=agentOk;
}
// שחקן יצא או הוצא באמצע סבב: מוציאים אותו מהסבב וממשיכים
function dropPlayer(id){
  if(!S||!S.players.some(x=>x.p===id))return;
  S.players=S.players.filter(x=>x.p!==id);
  delete S.answers[id];delete S.votes[id];
  for(const v in S.votes)if(S.votes[v]===id)delete S.votes[v]; // מי שהצביע לו מצביע מחדש
  const wasImp=S.imps.includes(id);S.imps=S.imps.filter(x=>x!==id);
  if(S.acc===id)S.acc=null;if(S.agent===id)S.agent=null;if(S.target===id)S.target=null;
  if(S.phase!=='reveal'){
    if(S.players.length<3){if(isHost)room.emit('tolobby',{});return render(true)}
    if(wasImp&&!S.imps.length){if(isHost)startRound(false,true);return render(true)} // האימפוסטר היחיד יצא: מחלקים את הסבב מחדש
    if(!S.imps.length)S.acc=null;
    if(S.phase==='answer'&&Object.keys(S.answers).length>=S.players.length)return setPhase('discuss');
    if(S.phase==='vote'&&Object.keys(S.votes).length>=S.players.length)return setPhase('reveal');
  }
  render(true);
}
async function enter(c,create,tries){
  err='';code=c;tries=tries||0;
  try{
    room=await R.join('mp'+c,create);
    room.onPeers(()=>{const pl0=players(),n=pl0.length;let moved=false;
      if(n>lastCount&&lastCount>0)sfx('join');lastCount=n;
      if(isHost&&myPeer&&hostPeer===null)hostPeer=myPeer;
      // אם המארח יצא, השחקן הראשון ברשימה (זהה אצל כולם) הופך למארח
      if(hostPeer&&n&&!pl0.some(x=>x.p===hostPeer)){hostPeer=pl0[0].p;isHost=hostPeer===myPeer;moved=true}
      if(isHost){room.emit('settings',cfg);room.emit('host',{h:myPeer})}
      if(S){const ids=pl0.map(x=>x.p);S.players.filter(x=>!ids.includes(x.p)).forEach(x=>dropPlayer(x.p))}
      if(!S||moved)render()});
    room.on('host',m=>{const h=m.data&&m.data.h,ids=players().map(x=>x.p);
      if(typeof h!=='string'||!ids.includes(h))return;
      if(hostPeer&&m.peer!==hostPeer&&ids.includes(hostPeer))return;
      const was=isHost;hostPeer=h;isHost=h===myPeer;
      if(isHost&&!was)room.emit('settings',cfg);
      render()});
    room.on('kick',m=>{if(!m.data||m.peer!==hostPeer)return;if(m.data.t===myPeer)return leaveLobby('המארח הוציא אותך מהמשחק');dropPlayer(m.data.t)});
    room.on('settings',m=>{if(!isHost)cfg=clean(m.data);if(!S&&!isHost)render()});
    room.on('round',m=>{const d=m.data;if(!d||!Array.isArray(d.players))return;
      const c2=clean(d.cfg);if(!G||d.n===1)G={scores:{},stats:{}};G.cur=+d.n||1;G.total=c2.rounds;G.cfg=c2;
      d.players.forEach(p=>{if(G.scores[p.p]===undefined)G.scores[p.p]=0});
      const ids=d.players.map(p=>p.p),ok=x=>typeof x==='string'&&ids.includes(x)?x:null;
      S={rid:d.rid,a:String(d.a),b:String(d.b),imps:Array.isArray(d.imps)?d.imps.filter(x=>ids.includes(x)):[],acc:ok(d.acc),agent:ok(d.agent),target:ok(d.target),
        players:d.players,answers:{},votes:{},phase:'answer',endAt:Date.now()+c2.ansT*1000};
      showMng=false;draft='';lastTick=-1;sfx('start');render()});
    room.on('answer',m=>{if(!S||S.phase!=='answer'||!m.data||m.data.rid!==S.rid||!S.players.some(x=>x.p===m.peer))return;S.answers[m.peer]=String(m.data.t).slice(0,60);if(Object.keys(S.answers).length>=S.players.length)setPhase('discuss');else render()});
    room.on('phase',m=>{if(S&&m.data&&m.data.rid===S.rid)setPhase(m.data.ph)});
    room.on('vote',m=>{if(!S||S.phase!=='vote'||!m.data||m.data.rid!==S.rid||!S.players.some(x=>x.p===m.peer)||!(S.players.some(x=>x.p===m.data.t)||(m.data.t==='none'&&G.cfg.noImp>0))||m.data.t===m.peer)return;S.votes[m.peer]=m.data.t;if(Object.keys(S.votes).length>=S.players.length)setPhase('reveal');else render()});
    room.on('close',()=>leaveLobby(isHost?'':'המארח סגר את הלובי'));
    room.on('tolobby',()=>{S=null;G=null;render()});
    await room.presence({name:myName});
  }catch(e){
    room=null;
    if(create&&e.message==='taken'&&tries<5)return enter(String(1000+Math.floor(Math.random()*9000)),true,tries+1);
    isHost=false;hostPeer=null;code='';err=e.message==='noroom'?'הלובי לא נמצא. בדקו את הקוד':'לא הצלחנו להיכנס ללובי';
  }
  render();
}
function leaveLobby(msg){try{room&&room.leave&&room.leave()}catch(e){}room=null;S=null;G=null;isHost=false;hostPeer=null;customK=null;code='';lastCount=0;err=msg||'';render()}
/* חפיסת שאלות: כל השאלות מעורבבות ונשלפות אחת-אחת בלי חזרות.
   החפיסה נשמרת בדפדפן, כך ששאלה לא חוזרת גם אחרי רענון או משחק חדש,
   עד שכל השאלות נגמרות. אז מערבבים מחדש, בלי שהשאלות האחרונות יופיעו מיד שוב. */
const pKey=p=>p[0]+'|'+p[1];
function drawPair(){
  let deck=[],recent=[];
  try{deck=JSON.parse(localStorage.getItem('qdeck')||'[]');recent=JSON.parse(localStorage.getItem('qrecent')||'[]')}catch(e){}
  if(!Array.isArray(deck))deck=[];if(!Array.isArray(recent))recent=[];
  const all=new Map(PAIRS.map(p=>[pKey(p),p]));
  deck=deck.filter(k=>all.has(k)&&!usedP.includes(k));
  if(!deck.length){
    const avoid=new Set(recent.slice(-30));
    const fresh=[...all.keys()].filter(k=>!avoid.has(k)),tail=[...all.keys()].filter(k=>avoid.has(k));
    for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]]}
    deck=fresh.concat(tail);usedP=[];
  }
  const k=deck.shift();usedP.push(k);recent=recent.concat(k).slice(-30);
  try{localStorage.setItem('qdeck',JSON.stringify(deck));localStorage.setItem('qrecent',JSON.stringify(recent))}catch(e){}
  return all.get(k);
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRound(newGame,same){
  const pl=players();if(pl.length<3)return;
  roundNo=newGame?1:same?(G?G.cur:1):(G?G.cur:0)+1;
  const pr=drawPair(),sw=Math.random()<.5,ids=shuffle(pl.map(x=>x.p));
  let imps=[];
  if(!(Math.random()*100<cfg.noImp)){const k=Math.max(1,Math.min(cfg.imps,Math.floor((ids.length-1)/2)));imps=ids.slice(0,k)}
  const rest=ids.slice(imps.length);let acc=null,agent=null,target=null;
  if(cfg.acc&&imps.length&&rest.length>=3)acc=rest.shift();
  if(cfg.agent&&rest.length>=3){agent=rest.shift();const cand=ids.filter(x=>x!==agent&&!imps.includes(x));target=cand[Math.floor(Math.random()*cand.length)]}
  room.emit('round',{rid:Date.now(),a:pr[sw?1:0],b:pr[sw?0:1],imps,acc,agent,target,players:pl.map(x=>({p:x.p,n:x.n})),n:roundNo,cfg});
}
function sendAns(){
  const el=document.getElementById('an'),t=el&&el.value.trim();if(!t)return;
  sfx('send');room.emit('answer',{rid:S.rid,t});
}
// טיימר: מתעדכן בלי לצייר מחדש את המסך. המארח מקדם שלבים; לכולם יש גיבוי אם המארח נתקע
setInterval(()=>{
  if(!S||!S.endAt||!room)return;
  const ms=S.endAt-Date.now(),l=Math.ceil(ms/1000),el=document.getElementById('tm');
  if(el){el.textContent=fmt(l);el.classList.toggle('low',l<=5)}
  if(l<=5&&l>0&&l!==lastTick){lastTick=l;sfx('tick')}
  if(S.phase==='answer'&&l<=1&&!S.autoSent&&S.answers[myPeer]===undefined&&draft.trim()){S.autoSent=true;room.emit('answer',{rid:S.rid,t:draft.trim()})}
  if(l<=0&&isHost&&S.sent!==S.phase){S.sent=S.phase;
    if(S.phase==='reveal'){if(players().length>=3)startRound(false);else room.emit('tolobby',{})}
    else room.emit('phase',{rid:S.rid,ph:NEXT[S.phase]})}
  if(ms<-3000&&NEXT[S.phase])setPhase(NEXT[S.phase]);
},250);
R=makeShim();roomOk=true;render();
